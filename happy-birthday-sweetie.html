  /* dezenter Verlauf unten links, damit die Karte lesbar bleibt */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(60% 55% at 12% 90%, rgba(0,0,0,0.38) 0%, transparent 60%);
    pointer-events: none;
  }

  .card {
    position: fixed;
    left: 50%;
    bottom: 5vh;
    transform: translateX(-50%);
    width: calc(100vw - 8vw);
    padding: 1.15rem 1.5rem;
    display: grid;
    align-items: center;
    gap: 1.5rem;
    border-radius: 22px;
    background: rgba(18, 24, 28, 0.34);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    backdrop-filter: blur(16px) saturate(1.15);
    border: 1px solid rgba(255, 255, 255, 0.24);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16),
                0 20px 50px -18px rgba(0, 0, 0, 0.55);
    color: #f6f2ea;
  }

  .meta {
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
  }

  .name {
    font-size: 0.72rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #eaa84f;
    padding-left: 0.1em;
  }

  .month {
    font-size: 1.55rem;
    font-weight: 700;
    line-height: 1;
  }

  .year {
    font-size: 0.85rem;
    font-weight: 300;
    color: rgba(246, 242, 234, 0.6);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(var(--days-in-month), minmax(0, 1fr));
    gap: 0.25rem;
  }

  .day-cell {
    min-width: 0;
    display: grid;
    justify-items: center;
    gap: 0.35rem;
  }

  .dow {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: rgba(246, 242, 234, 0.5);
    text-transform: uppercase;
  }

  .day {
    width: 2rem;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    border-radius: 999px;
    color: #f6f2ea;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }

  .day.weekend { color: rgba(246, 242, 234, 0.45); }

  .day.today {
    background: #eaa84f;
    color: #21160c;
    font-weight: 700;
    text-shadow: none;
    box-shadow: 0 6px 18px -6px rgba(234, 168, 79, 0.8);
  }

  @media (max-width: 560px) {
    .card { width: 94vw; padding: 1rem 1.1rem 1.15rem; }
    .meta { gap: 0.6rem; }
    .grid { gap: 0.1rem; }
    .day-cell { gap: 0.25rem; }
    .day { width: 1.35rem; font-size: 0.68rem; }
    .dow { font-size: 0.5rem; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="meta">
      <div class="name">Jonna</div>
      <div class="month" id="month"></div>
      <div class="year" id="year"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

<script>
  const MONTHS = ["Januar","Februar","Maerz","April","Mai","Juni",
                  "Juli","August","September","Oktober","November","Dezember"];
  const MONTHS_DISPLAY = ["Januar","Februar","M\u00e4rz","April","Mai","Juni",
                  "Juli","August","September","Oktober","November","Dezember"];
  const DOW = ["Mo","Di","Mi","Do","Fr","Sa","So"];

  function render() {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const today = now.getDate();

    document.getElementById("month").textContent = MONTHS_DISPLAY[m];
    document.getElementById("year").textContent = y;

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    grid.style.setProperty("--days-in-month", daysInMonth);

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement("div");
      cell.className = "day-cell";
      const weekday = (new Date(y, m, d).getDay() + 6) % 7;
      const dow = document.createElement("div");
      dow.className = "dow";
      dow.textContent = DOW[weekday];
      const day = document.createElement("div");
      day.className = "day";
      if (weekday >= 5) day.classList.add("weekend");
      if (d === today) day.classList.add("today");
      day.textContent = d;
      cell.append(dow, day);
      grid.appendChild(cell);
    }
  }

  render();
  setInterval(render, 5 * 60 * 1000);
</script>
</body>
